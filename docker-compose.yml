services:

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potfolio_production

    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build:
      context: .

    container_name: potfolio_web

    depends_on:
      - db

    environment:
      RAILS_ENV: production

      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potfolio_production

      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}

    ports:
      - "3000:80"


volumes:
  postgres_data:
